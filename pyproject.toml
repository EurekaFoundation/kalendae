[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kalendae"
version = "0.2.0"
description = "Calendario libero e open source in stile Google Calendar"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Francesco Franchino" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "eureka-core @ git+https://github.com/EurekaFoundation/eureka-core@v0.1.1",
]

[project.gui-scripts]
kalendae = "kalendae.__main__:main"

[tool.setuptools.packages.find]
include = ["kalendae*"]
