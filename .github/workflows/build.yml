# Test e pacchetti di Kalendae per Windows, macOS e Linux.
#  - a ogni push e pull request: test + build (pacchetti scaricabili dagli "Artifacts" del run)
#  - quando si pubblica un tag "v*" (es. v0.2.0): in più crea una Release con i pacchetti allegati
name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Librerie di sistema per Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dipendenze
        run: pip install -r requirements.txt pytest
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-22.04
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Librerie di sistema per Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Versione
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import kalendae; print(kalendae.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build con PyInstaller
        run: python scripts/build.py

      - name: Pacchetti Windows (installer + portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging\kalendae.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\Kalendae -DestinationPath "dist\Kalendae-${{ steps.ver.outputs.version }}-windows-portable.zip"

      - name: Pacchetto macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Kalendae.app "dist/Kalendae-${{ steps.ver.outputs.version }}-macos.zip"

      - name: Pacchetto Linux
        if: runner.os == 'Linux'
        run: |
          cp packaging/kalendae.desktop packaging/install-linux.sh assets/kalendae.png dist/Kalendae/
          chmod +x dist/Kalendae/install-linux.sh
          tar -czf "dist/Kalendae-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz" -C dist Kalendae

      - uses: actions/upload-artifact@v4
        with:
          name: Kalendae-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
